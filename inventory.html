<!DOCTYPE html>
<html lang="uz">
<head>
    <script>
        try {
            try { document.documentElement.style.visibility = 'hidden'; } catch (e) {}
            const path = window.location.pathname || '';
            const filename = path.substring(path.lastIndexOf('/') + 1).toLowerCase();
            if (filename !== 'login.html' && filename !== 'register.html') {
                if (!localStorage.getItem('qp_active_workspace')) {
                    window.stop();
                    window.location.replace('login.html');
                } else {
                    try { document.documentElement.style.visibility = 'visible'; } catch (e) {}
                }
            } else {
                if (localStorage.getItem('qp_active_workspace') && filename === 'login.html') {
                    window.location.replace('index.html');
                } else {
                    try { document.documentElement.style.visibility = 'visible'; } catch (e) {}
                }
            }
        } catch (e) { try { window.stop(); window.location.replace('login.html'); } catch (e) {} }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumPulse | Hyperion Inventory</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ⚡ ZOOM VA RESPONSIVE BREAKING FIXES */
        body {
            background: #060b19;
            margin: 0;
            min-height: 100vh;
        }

        /* Konteyner siqilib ketmasligi uchun dinamik flex */
        .app-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
        }

        /* Sidebar qattiq o'lchami */
        .sidebar {
            width: 260px;
            min-width: 260px;
            box-sizing: border-box;
        }

        /* Asosiy panel zoom qilinganda o'ngga qarab cheksiz chiqib ketishini to'xtatadi */
        .main-content {
            flex-grow: 1;
            min-width: 0; 
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Navbar elementlari sig'ishi uchun auto-wrap */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap; /* Kichik ekranda pastga chiroyli tushishi uchun */
            padding: 15px 20px;
            box-sizing: border-box;
        }

        .search-bar {
            display: flex;
            align-items: center;
            flex-grow: 1;
            min-width: 200px;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            outline: none;
            margin-left: 10px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dashboard-wrapper {
            width: 100%;
            box-sizing: border-box;
        }

        /* 📊 ADAPTIVE MULTI-COLUMN GRID TIZIMI */
        .inv-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* Zoom bo'lganda ustunlar sonini avtomat kamaytiradi */
            gap: 20px; 
            margin-top: 20px; 
            width: 100%;
            box-sizing: border-box;
        }

        .inv-card { 
            padding: 20px; 
            position: relative; 
            border-left: 4px solid var(--neon-purple); 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }
        
        .inv-card.alert { border-left-color: #ff4b4b; box-shadow: 0 0 15px rgba(255, 75, 75, 0.1); }
        .inv-card h3 { font-size: 16px; margin: 5px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .inv-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 14px; gap: 10px; }
        .inv-qty { font-family: var(--font-heading); font-size: 18px; color: var(--neon-cyan); }
        .inv-card.alert .inv-qty { color: #ff4b4b; }
        .inv-actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .inv-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.3s; flex: 1; text-align: center; }
        .inv-btn:hover { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
        .inv-btn.btn-delete:hover { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }

        /* Telefon yoki haddan tashqari katta zoom holati uchun */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; border-right: none; border-bottom: 1px solid rgba(0, 242, 254, 0.15); }
            .main-content { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <div class="sidebar-logo"><i class="fa-solid fa-atom"></i><span>QuantumPulse</span></div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item smooth-transition"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="crm.html" class="nav-item smooth-transition"><i class="fa-solid fa-users-viewfinder"></i> Neural CRM</a>
                <a href="inventory.html" class="nav-item active smooth-transition"><i class="fa-solid fa-boxes-stacked"></i> Hyperion Inventory</a>
                <a href="finance.html" class="nav-item smooth-transition"><i class="fa-solid fa-wallet"></i> Apex FinTech</a>
                <a href="settings.html" class="nav-item smooth-transition"><i class="fa-solid fa-sliders"></i> Sozlamalar</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" style="width:100%; padding:10px; background:rgba(255,75,75,0.2); border:1px solid #ff4b4b; color:#fff; border-radius:8px; cursor:pointer;">
                    <i class="fa-solid fa-power-off"></i> Chiqish
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar glass-panel">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Ombordan tovar qidirish...">
                </div>
                <div class="top-actions">
                    <button class="glass-panel" id="sync-force-btn" style="padding: 10px 15px; color: #fff; cursor: pointer; background: rgba(0,242,254,0.05); border-radius: 8px; border: 1px solid var(--neon-cyan);"><i class="fa-solid fa-rotate"></i> Yangilash</button>
                    <button class="glass-panel" id="add-stock-btn" style="padding: 10px 20px; color: #fff; cursor: pointer; background: rgba(0,242,254,0.1); border-radius: 8px; border: 1px solid rgba(0,242,254,0.2);"><i class="fa-solid fa-plus"></i> Yangi Tovar</button>
                </div>
            </header>

            <div class="dashboard-wrapper">
                <div class="welcome-section">
                    <h1>Hyperion <span>Inventory</span></h1>
                    <p>Cloud-Sync: Zaxiralar va ombor qoldiqlari nazorati moduli.</p>
                </div>

                <div class="inv-grid" id="inventory-container"></div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let inventory = [];
            const container = document.getElementById('inventory-container');
            const searchInput = document.getElementById('search-input');

            // 1. DATA LOADER
            function loadAndRender() {
                // Load per-user inventory and global defaults
                const userItems = (typeof ERPStorage !== 'undefined' && typeof ERPStorage.getInventory === 'function') ? ERPStorage.getInventory() : (JSON.parse(localStorage.getItem('qp_inventory')) || []);
                const defaults = (typeof ERPStorage !== 'undefined' && typeof ERPStorage.getDefaults === 'function') ? ERPStorage.getDefaults('inventory') || [] : (JSON.parse(localStorage.getItem('qp_defaults_inventory') || '[]'));

                // If user has their own items, show only them. Otherwise show defaults as initial view.
                inventory = (userItems && userItems.length > 0) ? userItems.slice() : (defaults.slice());
                renderInventory(inventory);
            }

            // 2. RENDERING ENGINE
            function renderInventory(itemsToRender) {
                container.innerHTML = "";
                if(itemsToRender.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;" class="glass-panel">Omborda mahsulotlar mavjud emas yoki yuklanmoqda...</div>`;
                    return;
                }

                itemsToRender.forEach((item, index) => {
                    let isAlert = item.qty <= 15;
                    const displayPrice = typeof window.formatCurrency === 'function' ? window.formatCurrency(item.price) : `$${item.price}`;
                    
                    container.innerHTML += `
                        <div class="inv-card glass-panel ${isAlert ? 'alert' : ''}">
                            <div>
                                <span style="font-size: 11px; color: var(--text-muted); font-family: var(--font-heading);">${item.id || 'INV-'+(index+1)}</span>
                                <h3 style="margin-top: 5px;" title="${item.name}">${item.name}</h3>
                                <p style="font-size: 13px; color: var(--text-muted); margin: 5px 0;">${item.category || 'Kategoriya yo\'q'}</p>
                            </div>
                            <div class="inv-meta">
                                <div>Soni: <span class="inv-qty">${item.qty} ta</span></div>
                                <div style="font-weight: 600; color: #00e676; font-size: 16px;">${displayPrice}</div>
                            </div>
                            <div class="inv-actions">
                                <button class="inv-btn" onclick="editQty('${item.id || index}')"><i class="fa-solid fa-pen"></i> Soni</button>
                                <button class="inv-btn btn-delete" onclick="deleteItem('${item.id || index}')"><i class="fa-solid fa-trash"></i> O'chirish</button>
                            </div>
                        </div>
                    `;
                });
            }

            // 3. CLOUD SYNC BRIDGE
            function saveState() {
                // Save to per-user storage via ERPStorage, and attempt cloud sync as before
                if(typeof ERPStorage !== 'undefined' && typeof ERPStorage.saveInventory === 'function') {
                    ERPStorage.saveInventory(inventory);
                } else {
                    localStorage.setItem('qp_inventory', JSON.stringify(inventory));
                }

                if (typeof window.saveAndCloudSync === 'function') {
                    // still notify cloud (will write to the workspace path)
                    window.saveAndCloudSync('qp_inventory', inventory);
                }

                renderInventory(inventory);
            }

            // 4. ADD ITEM
            document.getElementById('add-stock-btn').addEventListener('click', () => {
                const name = prompt("Yangi mahsulot nomini kiriting:");
                if(!name) return;
                
                const price = prompt("Mahsulot narxini kiriting ($):", "100");
                if(!price || isNaN(price)) { alert("Narx noto'g'ri kiritildi!"); return; }

                const qty = prompt("Ombordagi boshlang'ich sonini kiriting:", "50");
                if(!qty || isNaN(qty)) { alert("Miqdor noto'g'ri kiritildi!"); return; }

                const category = prompt("Kategoriyasini kiriting:", "Tayyor Mahsulotlar") || "Tayyor Mahsulotlar";

                const newItem = {
                    id: "INV-" + Date.now().toString().slice(-4),
                    name: name,
                    category: category,
                    qty: parseInt(qty),
                    price: parseFloat(price),
                    status: "Omborda"
                };

                inventory.push(newItem);
                saveState();
            });

            // 5. UPDATE & DELETE
            window.editQty = function(id) {
                const item = inventory.find(i => i.id === id || inventory.indexOf(i) == id);
                if(!item) return;
                const newQty = prompt(`"${item.name}" uchun yangi miqdorni kiriting:`, item.qty);
                if(newQty !== null && !isNaN(newQty)) {
                    item.qty = parseInt(newQty);
                    if(typeof window.logSystemActivity === 'function') window.logSystemActivity(`Ombor: ${item.name} miqdori ${newQty} ga o'zgartirildi`);
                    saveState();
                }
            };

            window.deleteItem = function(id) {
                if(confirm("Ushbu mahsulotni ombordan butunlay o'chirmoqchimisiz?")) {
                    const idx = inventory.findIndex(i => i.id === id || inventory.indexOf(i) == id);
                    if(idx > -1) {
                        if(typeof window.logSystemActivity === 'function') window.logSystemActivity(`Ombor: ${inventory[idx].name} o'chirildi`);
                        inventory.splice(idx, 1);
                        saveState();
                    }
                }
            };

            // 6. SEARCH MECHANISM
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = inventory.filter(item => 
                    item.name.toLowerCase().includes(query) || 
                    (item.id && item.id.toLowerCase().includes(query)) ||
                    (item.category && item.category.toLowerCase().includes(query))
                );
                renderInventory(filtered);
            });

            // 7. FORCE REFETCH DRIVER
            document.getElementById('sync-force-btn').addEventListener('click', async () => {
                if(typeof window.loadDataFromGitHub === 'function') {
                    await window.loadDataFromGitHub();
                    setTimeout(loadAndRender, 1500);
                } else {
                    loadAndRender();
                }
            });

            // Avtomat hodisalarni tinglash (Boshqa sahifada o'zgarsa srazi yangilanishi uchun)
            window.addEventListener('local_data_changed', loadAndRender);

            // Tizimni yondirish
            loadAndRender();
            setTimeout(loadAndRender, 2500);
        });
    </script>
</body>
</html>
