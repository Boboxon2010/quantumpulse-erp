<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumPulse | Hyperion Inventory</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .inv-card { padding: 20px; position: relative; border-left: 4px solid var(--neon-purple); }
        .inv-card.alert { border-left-color: #ff4b4b; box-shadow: 0 0 15px rgba(255, 75, 75, 0.1); }
        .inv-card h3 { font-size: 16px; margin-bottom: 10px; }
        .inv-meta { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; }
        .inv-qty { font-family: var(--font-heading); font-size: 20px; color: var(--neon-cyan); }
        .inv-card.alert .inv-qty { color: #ff4b4b; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <div class="sidebar-logo"><i class="fa-solid fa-atom"></i><span>QuantumPulse</span></div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item smooth-transition"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="crm.html" class="nav-item smooth-transition"><i class="fa-solid fa-users-viewfinder"></i> Neural CRM</a>
                <a href="inventory.html" class="nav-item active smooth-transition"><i class="fa-solid fa-boxes-stacked"></i> Hyperion Inventory</a>
                <a href="finance.html" class="nav-item smooth-transition"><i class="fa-solid fa-wallet"></i> Apex FinTech</a>
                <a href="settings.html" class="nav-item smooth-transition"><i class="fa-solid fa-sliders"></i> Sozlamalar</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" style="width:100%; padding:10px; background:rgba(255,75,75,0.2); border:1px solid #ff4b4b; color:#fff; border-radius:8px; cursor:pointer;">
                    <i class="fa-solid fa-power-off"></i> Chiqish
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar glass-panel">
                <div class="search-bar"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Ombordan tovar qidirish..."></div>
                <div class="top-actions"><button class="glass-panel" id="add-stock-btn" style="padding: 10px 20px; color: #fff; cursor: pointer; background: rgba(0,242,254,0.1); border-radius: 8px;"><i class="fa-solid fa-plus"></i> Yangi Tovar</button></div>
            </header>

            <div class="dashboard-wrapper">
                <div class="welcome-section">
                    <h1>Hyperion <span>Inventory</span></h1>
                    <p>Zaxiralar va ombor qoldiqlari nazorati moduli.</p>
                </div>

                <div class="inv-grid" id="inventory-container">
                    </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inventory = ERPStorage.getInventory();
            const container = document.getElementById('inventory-container');

            function renderInventory() {
                container.innerHTML = "";
                inventory.forEach(item => {
                    let isAlert = item.qty <= 15;
                    container.innerHTML += `
                        <div class="inv-card glass-panel ${isAlert ? 'alert' : ''}">
                            <span style="font-size: 11px; color: var(--text-muted); font-family: var(--font-heading);">${item.id}</span>
                            <h3 style="margin-top: 5px;">${item.name}</h3>
                            <p style="font-size: 13px; color: var(--text-muted);">${item.category}</p>
                            <div class="inv-meta">
                                <div>Soni: <span class="inv-qty">${item.qty} ta</span></div>
                                <div style="font-weight: 600; color: var(--neon-green); font-size: 16px;">$${item.price}</div>
                            </div>
                        </div>
                    `;
                });
            }

            renderInventory();

            // Interaktivlik: Yangi mahsulot qo'shish simulyatsiyasi
            document.getElementById('add-stock-btn').addEventListener('click', () => {
                const name = prompt("Mahsulot nomini kiriting:");
                if(name) {
                    const newItem = {
                        id: "INV-00" + (inventory.length + 1),
                        name: name,
                        category: "Tayyor Mahsulotlar",
                        qty: Math.floor(Math.random() * 80) + 10,
                        price: Math.floor(Math.random() * 1000) + 100,
                        status: "Omborda"
                    };
                    inventory.push(newItem);
                    ERPStorage.saveInventory(inventory);
                    renderInventory();
                }
            });
        });
    </script>
</body>
</html>
