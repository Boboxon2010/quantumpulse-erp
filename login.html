<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumPulse | Kirish</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-box { width: 100%; max-width: 420px; padding: 40px; border-radius: 24px; text-align: center; }
        .auth-input-group { margin-bottom: 25px; text-align: left; }
        .auth-input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .auth-field { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 12px; color: #fff; outline: none; font-family: var(--font-body); }
        .auth-field:focus { border-color: var(--neon-cyan); }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; font-family: var(--font-heading); letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box glass-panel">
            <div class="sidebar-logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-atom"></i><span>QuantumPulse</span>
            </div>
            <h2 style="margin-bottom: 30px; font-family: var(--font-heading); font-size: 20px;">Tizimga kirish</h2>
            
            <form id="login-form">
                <div class="auth-input-group">
                    <label>Login</label>
                    <input type="text" id="login-username" class="auth-field" placeholder="Username" required>
                </div>
                <div class="auth-input-group">
                    <label>Parol</label>
                    <input type="password" id="login-password" class="auth-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn smooth-transition">TIZIMNI ISHGA TUSHIRISH</button>
            </form>
            <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">Tizim bormi? <a href="register.html" style="color: var(--neon-cyan); text-decoration: none;">Yangi qurish</a></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const stored = JSON.parse(localStorage.getItem('qp_auth_config'));
            if(!stored) {
                alert("❌ Tizimda foydalanuvchi yo'q! Oldin Ro'yxatdan o'ting.");
                return;
            }
            
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;

            if (u === stored.username && p === stored.password) {
                localStorage.setItem('qp_is_logged_in', 'true');
                window.location.href = "index.html";
            } else {
                alert("❌ Xato! Login yoki Parol noto'g'ri.");
            }
        });
    </script>
</body>
</html>
