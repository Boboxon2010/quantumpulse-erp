<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumPulse | Ro'yxatdan O'tish</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-box { width: 100%; max-width: 450px; padding: 40px; border-radius: 24px; text-align: center; }
        .auth-input-group { margin-bottom: 20px; text-align: left; }
        .auth-input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .auth-field { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 12px; color: #fff; outline: none; font-family: var(--font-body); }
        .auth-field:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; font-family: var(--font-heading); letter-spacing: 1px; margin-top: 10px; }
        .auth-btn:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box glass-panel">
            <div class="sidebar-logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-atom"></i><span>QuantumPulse</span>
            </div>
            <h2 style="margin-bottom: 10px; font-family: var(--font-heading); font-size: 20px;">Tizim poydevorini quring</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">Admin hisob qaydnomasini yarating</p>
            
            <form id="register-form">
                <div class="auth-input-group">
                    <label>To'liq Ismingiz</label>
                    <input type="text" id="reg-name" class="auth-field" placeholder="John Doe" required>
                </div>
                <div class="auth-input-group">
                    <label>Kompaniya Nomi</label>
                    <input type="text" id="reg-company" class="auth-field" placeholder="Quantum Industries" required>
                </div>
                <div class="auth-input-group">
                    <label>Tizim uchun Login</label>
                    <input type="text" id="reg-username" class="auth-field" placeholder="admin2026" required>
                </div>
                <div class="auth-input-group">
                    <label>Xavfsiz Parol</label>
                    <input type="password" id="reg-password" class="auth-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn smooth-transition">TIZIMNI YARATISH</button>
            </form>
            <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">Akkount bormi? <a href="login.html" style="color: var(--neon-cyan); text-decoration: none;">Kirish</a></p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const config = {
                name: document.getElementById('reg-name').value,
                company: document.getElementById('reg-company').value,
                username: document.getElementById('reg-username').value.trim(),
                password: document.getElementById('reg-password').value,
                themeCyan: "#00f2fe",
                themePurple: "#4facfe",
                blurAmount: "12px"
            };
            localStorage.setItem('qp_auth_config', JSON.stringify(config));
            alert("🎉 Tizim muvaffaqiyatli sozlandi! Endi login orqali kiring.");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
