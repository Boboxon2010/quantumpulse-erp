<!DOCTYPE html>
<html lang="uz">
<head>
    <script>
        // If user already authenticated, don't show login page - send to main dashboard
        try {
            if (localStorage.getItem('qp_active_workspace')) {
                window.location.replace('index.html');
            }
        } catch (e) { /* ignore */ }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumPulse | Xavfsiz Kirish</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #060b19;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.05);
            text-align: center;
        }
        .login-logo { font-size: 32px; color: #fff; font-weight: 700; margin-bottom: 10px; }
        .login-logo i { color: #00f2fe; margin-right: 10px; }
        .login-card p { color: #a2b1c6; font-size: 14px; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #a2b1c6; }
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .login-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo"><i class="fa-solid fa-atom"></i>QuantumPulse</div>
        <p>Enterprise Multi-Workspace Xavfsiz Kirish Tizimi</p>
        
        <form id="login-form">
            <div class="input-group">
                <i class="fa-solid fa-user-secret"></i>
                <input type="text" id="username-input" placeholder="Foydalanuvchi nomi..." required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password-input" placeholder="Parol..." required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-building"></i>
                <input type="text" id="company-input" placeholder="Kompaniya nomi... (ixtiyoriy)">
            </div>
            <button type="submit" class="login-btn">Tizimga Kirish</button>
        </form>
        <div style="margin-top: 16px; display:flex; gap:10px; justify-content:center;">
            <button id="goto-register" class="login-btn" style="background:transparent; border:1px solid rgba(255,255,255,0.08);">Ro'yxatdan o'tish</button>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const company = document.getElementById('company-input').value.trim();

            const users = JSON.parse(localStorage.getItem('qp_user_records') || '{}');
            let user = users[username];
            if (!user) {
                // Fallback: if per-user namespaced data exists, allow recovery flow
                const hasLocalData = localStorage.getItem(`qp_inventory::${username}`) || localStorage.getItem(`qp_customers::${username}`);
                if (hasLocalData) {
                    const doRecover = confirm("Foydalanuvchi lokal ma'lumotlarda topildi, parolni qayta tiklash orqali hisobni tiklamoqchimisiz?");
                    if (!doRecover) { alert('Iltimos roʻyxatdan oʻting yoki toʻgʻri foydalanuvchi nomini kiriting.'); return; }

                    // Prompt for new password (simple recovery). In production use secure flow.
                    let newPass = prompt('Yangi parolni kiriting (kamida 6 belgi):');
                    if (!newPass || newPass.length < 6) { alert('Parol juda qisqa yoki bekor qilindi.'); return; }
                    // Create minimal user record
                    users[username] = {
                        name: username,
                        company: '',
                        username: username,
                        password_enc: btoa(newPass),
                        created_at: new Date().toISOString()
                    };
                    localStorage.setItem('qp_user_records', JSON.stringify(users));
                    user = users[username];
                    alert('Hisob tiklandi. Endi kiring.');
                } else {
                    alert('Foydalanuvchi topilmadi. Iltimos roʻyxatdan oʻting.');
                    return;
                }
            }
            try {
                if (user.password_enc !== btoa(password) || (company && user.company !== company)) {
                    alert('Login yoki parol notoʻgʻri.');
                    return;
                }
            } catch (err) { alert('Login jarayonida xatolik.'); return; }

            // Authentication OK. Set active user workspace to username
            localStorage.setItem('qp_active_workspace', username);
            localStorage.setItem('qp_username', username);

            // Ensure per-user storages exist; do not delete defaults
            if (!localStorage.getItem(`qp_inventory::${username}`)) localStorage.setItem(`qp_inventory::${username}`, JSON.stringify([]));
            if (!localStorage.getItem(`qp_customers::${username}`)) localStorage.setItem(`qp_customers::${username}`, JSON.stringify([]));

            // Redirect to dashboard
            window.location.href = 'index.html';
        });

        // Register button
        const rBtn = document.getElementById('goto-register');
        
        if (rBtn) rBtn.addEventListener('click', () => { window.location.href = 'register.html'; });
    </script>
</body>
</html>
